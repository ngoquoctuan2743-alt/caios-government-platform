name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: citizen_ai
          POSTGRES_PASSWORD: citizen_ai
          POSTGRES_DB: citizen_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U citizen_ai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://citizen_ai:citizen_ai@localhost:5432/citizen_ai?schema=public
      AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Run migrations (regression gate for Rule Engine tables)
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build

      - name: Test
        run: npm test --if-present
