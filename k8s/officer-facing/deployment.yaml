apiVersion: apps/v1
kind: Deployment
metadata:
  name: officer-console
  namespace: officer-facing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: officer-console
  template:
    metadata:
      labels:
        app: officer-console
    spec:
      containers:
        - name: app
          image: citizen-ai-case-manager:latest
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: app-secrets
          readinessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: officer-console
  namespace: officer-facing
spec:
  selector:
    app: officer-console
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: officer-console
  namespace: officer-facing
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: officer-console
  minReplicas: 2
  # Steady business-hours load -- scale conservatively vs. citizen-facing.
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
